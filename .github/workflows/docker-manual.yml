name: Sync Docker Image to Aliyun ACR
permissions:
  contents: read

# 使用说明：
#
# 在仓库 Settings → Secrets → Actions 中配置以下 Secrets：
#   - ACR_PASSWORD         阿里云 ACR 登录密码
#   - DATABASE_URL         数据库连接串（作为 build-arg 注入）
#   - KEY_VAULTS_SECRET    密钥（作为 build-arg 注入）

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像 tag，例如 rc-1、latest、v1.2.0'
        required: true
        default: 'latest'
        type: string
      dockerfile:
        description: '使用哪个 Dockerfile'
        required: true
        default: 'Dockerfile.database'
        type: choice
        options:
          - Dockerfile.database
          - Dockerfile
          - Dockerfile.pglite
      extra_build_args:
        description: '额外的 build-arg，用分号分隔，格式 KEY=VALUE;KEY=VALUE。不需要填 DATABASE_URL / KEY_VAULTS_SECRET。'
        required: false
        default: 'NEXT_PUBLIC_ENABLE_NEXT_AUTH=1;NEXT_AUTH_SSO_PROVIDERS=casdoor;NEXT_PUBLIC_SERVICE_MODE=server;DATABASE_DRIVER=node'
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: crpi-maroaqxtmvcchx1u.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_USERNAME: mocha.wyh
  ACR_REPO: crpi-maroaqxtmvcchx1u.cn-hangzhou.personal.cr.aliyuncs.com/lobehub-enterprise/lobehub

jobs:
  build:
    name: Sync to ACR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ env.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Mask secret build-arg values
        run: |
          [ -n "$DATABASE_URL" ]      && echo "::add-mask::$DATABASE_URL"
          [ -n "$KEY_VAULTS_SECRET" ] && echo "::add-mask::$KEY_VAULTS_SECRET"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}

      - name: Build & push to ACR
        run: |
          # 将分号分隔的 build-args 转成数组
          BUILD_ARGS=()
          while IFS= read -r pair; do
            pair="$(echo "$pair" | xargs)"  # trim 首尾空白
            [ -n "$pair" ] && BUILD_ARGS+=(--build-arg "$pair")
          done < <(echo "$EXTRA_BUILD_ARGS" | tr ';' '\n')

          # 注入敏感 build-args
          [ -n "$DATABASE_URL" ]      && BUILD_ARGS+=(--build-arg "DATABASE_URL=$DATABASE_URL")
          [ -n "$KEY_VAULTS_SECRET" ] && BUILD_ARGS+=(--build-arg "KEY_VAULTS_SECRET=$KEY_VAULTS_SECRET")

          docker buildx build \
            -t "${{ env.ACR_REPO }}:${{ inputs.image_tag }}" \
            -f "${{ inputs.dockerfile }}" \
            "${BUILD_ARGS[@]}" \
            --push \
            .
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          KEY_VAULTS_SECRET: ${{ secrets.KEY_VAULTS_SECRET }}
          EXTRA_BUILD_ARGS: ${{ inputs.extra_build_args }}

      - name: Print build summary
        if: always()
        run: |
          echo "## Sync Docker Image to Aliyun ACR - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 字段 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${{ env.ACR_REPO }}:${{ inputs.image_tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Dockerfile | \`${{ inputs.dockerfile }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "拉取命令：" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.ACR_REPO }}:${{ inputs.image_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
